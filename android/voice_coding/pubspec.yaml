name: voicing
description: "Voicing - Phone to PC voice bridge"
publish_to: 'none'
version: 2.9.10+11

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.5
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon_1024.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/icons/icon_1024.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
